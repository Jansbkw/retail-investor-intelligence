services:
  api:
    build: .
    command: sh -c "python -m app.cli prepare-demo && exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_SMALL: ${OPENAI_MODEL_SMALL:-}
      OPENAI_MODEL_LARGE: ${OPENAI_MODEL_LARGE:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ALLOW_PAID_X_CALLS: ${ALLOW_PAID_X_CALLS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  ui:
    build: .
    command: streamlit run app/ui/streamlit_app.py --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
